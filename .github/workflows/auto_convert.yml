name: Auto Convert Subscription to Nodes

on:
  schedule:
    # 每天 UTC 时间 16:00 (北京时间 24:00) 自动运行
    - cron: '0 16 * * *'
  workflow_dispatch: # 支持手动点击运行

jobs:
  convert-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予提交代码权限

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # ---------------- 就在这里修改 ----------------
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests pyyaml
    # ----------------------------------------------

    - name: 执行转换脚本
      run: |
        python convert.py

    - name: 自动提交更新文件到仓库
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        if [ -f "kv4ynTKhcJWXZ3h.yaml" ] && [ -f "kv4ynTKhcJWXZ3h.txt" ]; then
          git add kv4ynTKhcJWXZ3h.yaml kv4ynTKhcJWXZ3h.txt
          if ! git diff --staged --quiet; then
            git commit -m "Auto updated clash.yaml & sub_base64.txt [$(date +'%Y-%m-%d')]"
            git push
          else
            echo "文件无变化，跳过提交"
          fi
        else
          echo "错误：convert.py 运行后未找到生成的节点文件！"
          exit 1
        fi
